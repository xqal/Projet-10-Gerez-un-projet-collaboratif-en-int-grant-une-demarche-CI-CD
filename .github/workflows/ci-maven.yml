# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Back & Front CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
      runs-on: ubuntu-latest
  
      steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0
            
        - name: Set up JDK 11
          uses: actions/setup-java@v4
          with:
            java-version: '11'
            distribution: 'temurin'
            cache: maven
            
        - name: Run tests & Sonar Analysis
          run: mvn -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=xqal_Projet-10-Gerez-un-projet-collaboratif-en-int-grant-une-demarche-CI-CD_back -Pcoverage
          working-directory: back
          env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  
        - name: Upload Jacoco Report
          uses: actions/upload-artifact@v4
          with:
            name: jacoco-report
            path: back/target/site/jacoco/

  frontend:
      runs-on: ubuntu-latest
  
      steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0
            
        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '16'
            cache: npm
            cache-dependency-path: front/package-lock.json
            
        - name: Install dependencies
          run: npm ci
          working-directory: front
          
        - name: Run tests
          run: npm run test -- --watch=false --browsers=ChromeHeadless --code-coverage
          working-directory: front

        - name: Debug coverage
          run: |
              ls -R front/coverage
              cat front/coverage/bobapp/lcov.info | head

        - name: SonarQube Scan
          uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 
          env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  
        - name: Upload Coverage Report
          uses: actions/upload-artifact@v4
          with:
            name: frontend-report
            path: front/coverage/

